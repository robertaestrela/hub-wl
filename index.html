<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sirius Games Hub</title>
<link rel="icon" href="assets/logos/sirius.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Tokens · UI da Nexus (gestão estilo Apple) com o azul da Sirius Games ===== */
:root{
  --bg:#0e0e10; --panel:#161618; --card:#1c1c1f; --hover:#26262b; --line:#ffffff14; --line-2:#ffffff0f;
  --text:#f4f4f5; --muted:#a1a1aa; --subtle:#71717a;
  --accent:#0059ff; --accent-h:#1f6bff; --bad:#ef4444;
  --f:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:clip;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{font:400 14px/20px var(--f);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
img,svg{display:block}
svg.i{width:16px;height:16px;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ===== Barra lateral recolhível (como a Nexus: recolhida vira um trilho de ícones e abre por cima no hover) ===== */
.app{--sw:240px;min-height:100vh;min-height:100dvh}
.app.mini{--sw:72px}
.side{position:fixed;top:0;left:0;z-index:20;width:var(--sw);height:100vh;height:100dvh;padding:8px;transition:width .35s var(--ease)}
.side-in{display:flex;flex-direction:column;width:100%;height:100%;padding:16px 8px 8px;border-radius:16px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line-2);overflow:hidden auto;scrollbar-width:none;transition:width .35s var(--ease),box-shadow .3s}
.side-in::-webkit-scrollbar{display:none}
.mini .side-in{width:56px}
.mini .side:is(:hover,.peek) .side-in{width:224px;box-shadow:inset 0 0 0 1px var(--line),0 24px 64px #000000b3}
.mini .side:not(:hover):not(.peek) :is(.logo b,.tog,.search input,.search kbd,.ni span,.ni em,.ni .ext){display:none}
.top-row{display:flex;align-items:center;gap:4px;padding-bottom:24px}
.logo{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding-left:4px}
.logo .sq{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:12px;background:#fff}
.logo .sq img{width:18px;height:auto}
.logo b{font:600 17px/24px var(--f);letter-spacing:-.03em;white-space:nowrap}
.logo b span{font-weight:400;color:var(--muted)}
.tog{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:12px;color:var(--subtle);transition:background .2s,color .2s}
.tog:hover{background:var(--hover);color:var(--text)}
.tog .chev{transition:transform .3s var(--ease)}
.mini .tog .chev{transform:rotate(180deg)}
.tog .burger{display:none}
.m-body{display:contents}
.search{display:flex;align-items:center;gap:8px;height:36px;margin-bottom:16px;padding:0 12px;border-radius:12px;background:var(--card);color:var(--subtle);box-shadow:inset 0 0 0 1px var(--line-2);cursor:text}
.search input{flex:1;min-width:0;outline:none;color:var(--text)}
.search input::placeholder{color:var(--subtle)}
.search input::-webkit-search-cancel-button{display:none}
.search:focus-within{box-shadow:inset 0 0 0 1px var(--accent)}
kbd{display:inline-grid;place-items:center;height:20px;padding:0 6px;border-radius:5px;background:#ffffff14;color:var(--muted);font:500 11px/1 var(--f)}
.filters{display:flex;flex-direction:column;gap:2px}
.ni{display:flex;align-items:center;gap:12px;width:100%;height:36px;padding:0 12px;border-radius:12px;color:var(--muted);text-align:left;white-space:nowrap;transition:background .2s,color .2s}
.ni:hover{background:var(--hover);color:var(--text)}
.ni.on{background:var(--hover);color:var(--text)}
.ni.on svg{color:var(--accent)}
.ni span{flex:1}
.ni em{font:500 12px/20px var(--f);font-style:normal;color:var(--subtle)}
.side-f{margin-top:auto}

.main{min-width:0;margin-left:var(--sw);padding:40px 32px 64px;transition:margin-left .35s var(--ease)}
.date{font:400 13px/18px var(--f);color:var(--muted)}
h1{margin-top:4px;font:600 32px/40px var(--f);letter-spacing:-.03em}
.subt{margin-top:4px;font:400 15px/20px var(--f);color:var(--muted)}
.h2{margin:32px 0 12px;font:600 15px/20px var(--f);color:var(--muted)}
.hl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.hc{min-width:0;display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s,box-shadow .2s}
a.hc:hover{background:var(--card);box-shadow:inset 0 0 0 1px #ffffff24}
.hc .lg{width:32px;height:32px;border-radius:12px}
.hc .lg img{width:18px;height:18px}
.hc div{flex:1;min-width:0}
.hc b{display:block;font:500 14px/20px var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc small{display:block;font:400 12px/16px var(--f);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc em{flex:none;font:400 12px/16px var(--f);font-style:normal;color:var(--subtle)}

/* ===== Uma marca por card: logo, nome e os dois links ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(296px,100%),1fr));gap:12px}
.bc{min-width:0;display:flex;flex-direction:column;gap:16px;padding:16px;border-radius:16px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .25s,transform .35s var(--ease)}
.bc:hover{box-shadow:inset 0 0 0 1px #ffffff2e;transform:translateY(-2px)}
.bh{display:flex;align-items:center;gap:12px}
.lg{position:relative;display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line-2)}
.lg img{width:22px;height:22px;object-fit:contain}
.lg i{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--panel)}
.bh b{flex:1;min-width:0;font:600 15px/20px var(--f);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{height:24px;padding:0 8px;border-radius:12px;background:#ffffff14;color:var(--muted);font:500 11px/24px var(--f);white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:8px}
/* link = pílula que abraça o texto, com o copiar dentro */
.lk{display:inline-flex;align-items:center;height:36px;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line-2);transition:background .2s}
.lk:hover{background:var(--hover)}
.lk a{display:flex;align-items:center;gap:6px;height:100%;padding:0 10px 0 14px;font:500 13px/16px var(--f);white-space:nowrap}
.lk a svg{width:12px;height:12px;opacity:.6}
.lk .cp{display:grid;place-items:center;width:32px;height:100%;border-left:1px solid var(--line);border-radius:0 12px 12px 0;color:var(--subtle);transition:color .2s,background .2s}
.lk .cp:hover{color:var(--text);background:#ffffff0f}
.lk.pri{background:var(--accent);box-shadow:none}
.lk.pri:hover{background:var(--accent-h)}
.lk.pri a{color:#fff}
.lk.pri .cp{border-color:#ffffff33;color:#ffffffb3}
.lk.pri .cp:hover{color:#fff;background:#ffffff1a}
.empty{margin-top:32px;padding:48px 16px;border-radius:16px;background:var(--panel);text-align:center;color:var(--muted)}
.hide{display:none !important}

.toast{position:fixed;left:50%;bottom:24px;z-index:50;display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;background:#f4f4f5;color:#0e0e10;font:500 13px/16px var(--f);box-shadow:0 12px 32px #00000080;transform:translate(-50%,24px);opacity:0;transition:opacity .3s,transform .4s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{color:#16a34a}

@media (max-width:820px){
  .side{position:sticky;width:auto;height:auto;padding:8px 8px 0}
  .main,.mini .main{margin-left:0}
  .side-in,.mini .side-in,.mini .side:is(:hover,.peek) .side-in{width:100%;height:auto;padding:12px;box-shadow:inset 0 0 0 1px var(--line-2)}
  .mini .side:not(:hover):not(.peek) :is(.logo b,.tog,.search input,.search kbd,.ni span,.ni em){display:revert}
  .top-row{padding-bottom:0}
  .tog .chev{display:none}
  .tog .burger{display:block}
  .m-body{display:none;padding-top:12px}
  .open .m-body{display:block}
  .search{margin-bottom:8px}
  .filters{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .ni{width:auto;flex:none}
  .side-f{display:none}
  .main{margin-left:0;padding:24px 16px 48px}
  h1{font-size:28px;line-height:36px}
}
@media (max-width:1600px){ .hl{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .hl{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="i-ext" viewBox="0 0 16 16"><path d="M6 3H3.5A.5.5 0 0 0 3 3.5v9a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V10M9 3h4v4M13 3 7.5 8.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-copy" viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 3.5v-1a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h1" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="m3.5 8.5 3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-grid" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="4.5" height="4.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
  <symbol id="i-deck" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 11v2.5M5.5 13.5h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="i-star" viewBox="0 0 16 16"><path d="m8 2 1.8 3.7 4 .6-2.9 2.8.7 4L8 11.2 4.4 13.1l.7-4L2.2 6.3l4-.6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
  <symbol id="i-chev" viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-menu" viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-git" viewBox="0 0 16 16"><path d="M8 1.5a6.5 6.5 0 0 0-2.06 12.67c.33.06.44-.14.44-.31v-1.1c-1.81.39-2.19-.87-2.19-.87-.3-.75-.72-.95-.72-.95-.59-.4.04-.4.04-.4.65.05 1 .67 1 .67.58 1 1.52.71 1.89.54.06-.42.23-.71.41-.87-1.45-.16-2.97-.72-2.97-3.22 0-.71.25-1.29.67-1.75-.07-.16-.29-.83.06-1.72 0 0 .55-.18 1.79.67a6.2 6.2 0 0 1 3.26 0c1.24-.85 1.79-.67 1.79-.67.35.89.13 1.56.06 1.72.42.46.67 1.04.67 1.75 0 2.5-1.52 3.06-2.98 3.22.24.2.45.6.45 1.21v1.79c0 .17.11.37.45.31A6.5 6.5 0 0 0 8 1.5z" fill="currentColor"/></symbol>
</svg>

<div class="app" id="app">
  <aside class="side" id="side">
    <div class="side-in">
      <div class="top-row">
        <a class="logo" href="#" aria-label="Sirius Games Hub"><span class="sq"><img src="assets/logos/sirius.svg" alt=""></span><b>Sirius Games <span>Hub</span></b></a>
        <button class="tog" id="tog" aria-label="Recolher menu" aria-expanded="true"><svg class="i chev"><use href="#i-chev"/></svg><svg class="i burger"><use href="#i-menu"/></svg></button>
      </div>
      <div class="m-body">
        <label class="search" title="Buscar marca"><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Buscar marca" autocomplete="off" aria-label="Buscar marca"><kbd id="kbd">⌘K</kbd></label>
        <nav class="filters" id="filters" aria-label="Filtro">
          <button class="ni on" data-f="all" title="Todas"><svg class="i"><use href="#i-grid"/></svg><span>Todas</span><em data-c="all"></em></button>
          <button class="ni" data-f="wl" title="White label"><svg class="i"><use href="#i-deck"/></svg><span>White label</span><em data-c="wl"></em></button>
          <button class="ni" data-f="casa" title="Da casa"><svg class="i"><use href="#i-star"/></svg><span>Da casa</span><em data-c="casa"></em></button>
        </nav>
      </div>
      <div class="side-f"><a class="ni" href="https://github.com/robertaestrela?tab=repositories" target="_blank" rel="noopener" title="GitHub"><svg class="i"><use href="#i-git"/></svg><span>GitHub</span><svg class="i ext"><use href="#i-ext"/></svg></a></div>
    </div>
  </aside>

  <main class="main">
    <p class="date" id="date"></p>
    <h1 id="hello">Olá</h1>
    <p class="subt" id="subt"></p>
    <h2 class="h2">Destaques</h2>
    <div class="hl" id="hl"></div>
    <h2 class="h2">Marcas</h2>
    <div class="grid" id="grid"></div>
    <div class="empty hide" id="empty">Nenhuma marca com esse nome.</div>
  </main>
</div>

<div class="toast" id="toast"><svg class="i"><use href="#i-check"/></svg><span>Link copiado</span></div>

<script>
/* ===== Os links (fonte única: para uma marca nova, acrescente uma linha e a logo em assets/logos) =====
   deck = apresentação · app = app da marca (caminhos em robertaestrela.github.io) · tag = aviso curto no card */
const BASE = 'https://robertaestrela.github.io/';
const BRANDS = [
  {k: 'bateu', name: 'Bateu Games', deck: 'bateu', app: 'bateu-games', g: 'wl'},
  {k: 'esportiva', name: 'Esportiva Games', deck: 'esportiva', app: 'esportiva-games', g: 'wl'},
  {k: 'sortenosgames', name: 'Sorte nos Games', deck: 'sortenosgames', app: 'sorte-nos-games', g: 'wl'},
  {k: 'esportesdasorte', name: 'Esportes da Sorte', deck: 'esportesdasorte', app: 'esportes-da-sorte-games', g: 'wl'},
  {k: 'vipgames', name: 'VIP Games', deck: 'vipgames', app: 'vip-games', g: 'wl'},
  {k: 'brgames', name: 'BR Games', deck: 'brgames', app: 'br-games', g: 'wl'},
  {k: 'mibrlos', name: 'Mibr.LOS', deck: 'mibrlos', app: 'mibrlos-games', g: 'wl'},
  {k: 'claro', name: 'Claro', deck: 'claro', app: 'claro-games', g: 'wl'},
  {k: 'liquid', name: 'Liquid', deck: 'liquid', app: 'liquid-games', g: 'wl', tag: 'EN'},
  {k: 'caze', name: 'Caze Games', deck: 'caze', app: 'caze-games', g: 'wl'},
  {k: 'loud', name: 'LOUD', deck: 'loud', app: 'loud-games', g: 'wl'},
  {k: 'losgrandes', name: 'Los Grandes', deck: 'losgrandes', app: 'los-grandes-games', g: 'wl'},
  {k: 'jhon', name: 'Jon Vlogs', deck: 'jonvlogs', app: 'jon-games', g: 'wl'},
  {k: 'krew', name: 'Krew', deck: 'krew', app: 'krew-games', g: 'wl'},
  {k: 'furia', name: 'Furia Games', deck: 'furia', app: 'furia-games', g: 'wl'},
  {k: 'kingpanda', name: 'KingPanda Games', deck: 'kingpanda', app: 'kingpanda-games', g: 'wl'},
  {k: 'sirius', name: 'Sirius Games', deck: null, app: 'sirius-games', g: 'casa', tag: 'Em breve'},
  {k: 'estrelagames', name: 'EstrelaGames', deck: 'vip', deckLabel: 'Convite VIP', app: 'truco-mineiro-estrelagames', g: 'casa', more: ['Afiliados', 'afiliados']},
];

/* ===== Destaques do topo: o que mudou por último (troque aqui; link = caminho em robertaestrela.github.io, ou null) ===== */
const HIGHLIGHTS = [
  {k: 'bateu', t: 'Bateu Games no ar', s: 'Apresentação e app', d: '30 out', link: 'bateu'},
  {k: 'brgames', t: '5 marcas novas', s: 'BR, VIP, Esportes da Sorte, Sorte nos Games e Esportiva', d: '30 out', link: 'brgames'},
  {k: 'sirius', t: 'Nova logo Sirius Games', s: 'Em todas as apresentações', d: '30 out', link: 'kingpanda'},
  {k: 'sirius', t: 'Apresentação da Sirius Games', s: 'Base institucional em produção', d: 'Em breve', link: null},
];

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const url = p => BASE + p + '/';
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const state = {f: 'all', q: ''};
const bad = new Set();   // marcas com algum link fora do ar (só aparece um pontinho vermelho na logo)

const h = new Date().getHours();
$('#hello').textContent = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
const d = new Date().toLocaleDateString('pt-BR', {weekday: 'long', day: 'numeric', month: 'long'});
$('#date').textContent = d.charAt(0).toUpperCase() + d.slice(1);
$('#subt').textContent = 'Apresentações e apps das white labels da Sirius Games';
if (!/Mac|iPhone|iPad/.test(navigator.platform)) $('#kbd').textContent = 'Ctrl K';
$('#hl').innerHTML = HIGHLIGHTS.map(x => `<${x.link ? `a href="${url(x.link)}" target="_blank" rel="noopener"` : 'div'} class="hc"><span class="lg"><img src="assets/logos/${x.k}.svg" alt=""></span><div><b>${x.t}</b><small>${x.s}</small></div><em>${x.d}</em></${x.link ? 'a' : 'div'}>`).join('');
$$('[data-c]').forEach(e => { e.textContent = BRANDS.filter(b => e.dataset.c === 'all' || b.g === e.dataset.c).length; });

const lk = (label, p, pri) => `<span class="lk${pri ? ' pri' : ''}"><a href="${url(p)}" target="_blank" rel="noopener">${label}<svg class="i"><use href="#i-ext"/></svg></a><button class="cp" data-copy="${url(p)}" aria-label="Copiar link: ${label}" title="Copiar link"><svg class="i"><use href="#i-copy"/></svg></button></span>`;
function render() {
  const list = BRANDS.filter(b => (state.f === 'all' || b.g === state.f) && (!state.q || norm(b.name).includes(state.q)));
  $('#empty').classList.toggle('hide', list.length > 0);
  $('#grid').innerHTML = list.map(b => `<article class="bc">
    <div class="bh"><span class="lg"><img src="assets/logos/${b.k}.svg" alt="">${bad.has(b.k) ? '<i title="Algum link não respondeu"></i>' : ''}</span><b>${b.name}</b>${b.tag ? `<span class="tag">${b.tag}</span>` : ''}</div>
    <div class="acts">${b.deck ? lk(b.deckLabel || 'Apresentação', b.deck, true) : ''}${lk('App', b.app, !b.deck)}${b.more ? lk(b.more[0], b.more[1]) : ''}</div>
  </article>`).join('');
}

$$('#filters [data-f]').forEach(n => n.addEventListener('click', () => { $$('#filters [data-f]').forEach(x => x.classList.toggle('on', x === n)); state.f = n.dataset.f; render(); if (MOB.matches) { app.classList.remove('open'); setTog(); } }));
const q = $('#q');
q.addEventListener('input', () => { state.q = norm(q.value.trim()); render(); });
/* ===== Barra lateral: no computador recolhe para um trilho de ícones (lembra a escolha); no celular abre e fecha como menu ===== */
const app = $('#app'), side = $('#side'), tog = $('#tog'), MOB = matchMedia('(max-width:820px)');
const setTog = () => { const open = MOB.matches ? app.classList.contains('open') : !app.classList.contains('mini'); tog.setAttribute('aria-expanded', open); tog.setAttribute('aria-label', MOB.matches ? (open ? 'Fechar menu' : 'Abrir menu') : (open ? 'Recolher menu' : 'Fixar menu aberto')); };
try { if (localStorage.getItem('hub-mini') === '1') app.classList.add('mini'); } catch (e) {}
tog.addEventListener('click', () => {
  if (MOB.matches) app.classList.toggle('open');
  else { app.classList.toggle('mini'); side.classList.remove('peek'); try { localStorage.setItem('hub-mini', app.classList.contains('mini') ? '1' : '0'); } catch (e) {} }
  setTog();
});
MOB.addEventListener('change', setTog); setTog();
q.addEventListener('blur', () => side.classList.remove('peek'));
addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (MOB.matches) { app.classList.add('open'); setTog(); } else side.classList.add('peek'); q.focus(); q.select(); }
  if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; q.dispatchEvent(new Event('input')); q.blur(); }
});

let tt;
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); } catch (err) { const t = document.createElement('textarea'); t.value = b.dataset.copy; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
  const toast = $('#toast'); toast.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('show'), 1600);
});

render();
// publicado no mesmo endereço, confere os links em silêncio: só a marca com link fora do ar ganha o pontinho vermelho
if (location.hostname === 'robertaestrela.github.io') {
  BRANDS.forEach(b => [b.deck, b.app, b.more && b.more[1]].filter(Boolean).forEach(p =>
    fetch('/' + p + '/', {method: 'HEAD', cache: 'no-store'}).then(r => { if (!r.ok) throw 0; }).catch(() => { bad.add(b.k); render(); })));
}
